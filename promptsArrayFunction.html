<!DOCTYPE html>
<html>
<body>

<h1>List all promptArray items:</h1>

<p id="array"></p>

<script>
var promptsArray = ["Prompt 1","Prompt 2","Prompt 3","Prompt 4","Prompt 5","Prompt 6", "Prompt 7"];
promptsArray.forEach(writeArray);

function writeArray (item) {
	document.getElementById("array").innerHTML += "{content_type: \"text\", title: " + item + ", payload: " + item + "}, " + "<br>";
}

</script>
</body>
</html>
